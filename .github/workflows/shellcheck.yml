name: ShellCheck

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck (Manjaro)
    runs-on: ubuntu-latest
    container:
      image: manjarolinux/build:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck from Manjaro repositories
        run: |
          set -e
          pacman -Sy --noconfirm --needed shellcheck

      - name: ShellCheck production scripts
        run: |
          set -e
          # SC2034 (unused variable) is a known issue in the production
          # runtime tracked for a later production fix phase. It is
          # excluded here only, so that the test-infrastructure phase does
          # not change runtime behavior.
          shellcheck --severity=warning --exclude=SC2034 \
            system-update \
            system-update-notify \
            profile.d/99-system-update.sh \
            awesome-updater.install

      - name: ShellCheck test infrastructure
        run: |
          set -e
          shellcheck --severity=warning \
            tests/run-tests.sh \
            tests/lib/*.sh \
            tests/test-*.sh \
            tests/mocks/*