name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck and syntax (Manjaro)
    # The host runner is only the CI worker. Every project step executes
    # inside the Manjaro container below.
    runs-on: ubuntu-latest
    container:
      image: manjarolinux/build:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck from Manjaro repositories
        run: |
          set -e
          pacman -Sy --noconfirm --needed shellcheck

      - name: Bash syntax check (bash -n)
        run: |
          set -e
          bash -n system-update
          bash -n system-update-notify
          bash -n profile.d/99-system-update.sh
          bash -n awesome-updater.install
          for f in tests/run-tests.sh tests/lib/*.sh tests/test-*.sh tests/mocks/*; do
            bash -n "$f"
          done

      - name: ShellCheck production scripts
        run: |
          set -e
          # SC2034 (unused variable) is a known issue in the production
          # runtime tracked for a later production fix phase. Runtime
          # behavior must not change during the test-infrastructure phase,
          # so SC2034 is excluded here only.
          shellcheck --severity=warning --exclude=SC2034 \
            system-update \
            system-update-notify \
            profile.d/99-system-update.sh \
            awesome-updater.install

      - name: ShellCheck test infrastructure
        run: |
          set -e
          shellcheck --severity=warning \
            tests/run-tests.sh \
            tests/lib/*.sh \
            tests/test-*.sh \
            tests/mocks/*

  unit-tests:
    name: Unit tests (isolated mocks, Manjaro)
    runs-on: ubuntu-latest
    container:
      image: manjarolinux/build:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install test dependencies from Manjaro repositories
        run: |
          set -e
          pacman -Sy --noconfirm --needed \
            bash coreutils findutils gawk grep sed util-linux inetutils

      - name: Prepare test executables
        run: |
          set -e
          chmod +x tests/mocks/*
          chmod +x tests/run-tests.sh
          chmod +x tests/test-*.sh

      - name: Run isolated test suite
        run: ./tests/run-tests.sh

  package-test:
    name: Package build and validation (Manjaro)
    runs-on: ubuntu-latest
    container:
      image: manjarolinux/build:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and runtime dependencies
        run: |
          set -e
          # base-devel and libarchive are needed for makepkg and archive
          # inspection. The remaining packages are the PKGBUILD's runtime
          # dependencies; makepkg refuses to build if any declared
          # dependency is not resolvable from the installed set.
          #
          # systemd-sysvcompat is included explicitly because the Manjaro
          # build image ships it pinned to the image's systemd version.
          pacman -Sy --noconfirm --needed \
            base-devel \
            libarchive \
            systemd-sysvcompat \
            bash \
            coreutils \
            inetutils \
            kernel-modules-hook \
            pacman \
            systemd \
            findutils \
            gawk \
            grep \
            sed \
            util-linux

      - name: Create non-root builder and chown workspace
        run: |
          set -e
          if ! id builduser >/dev/null 2>&1; then
            useradd -m builduser
          fi
          chown -R builduser:builduser "$GITHUB_WORKSPACE"

      - name: Build package with makepkg
        run: |
          set -e
          su builduser -c "cd '$GITHUB_WORKSPACE' && makepkg -f --noconfirm"

      - name: Verify package contents
        run: |
          set -e
          pkg="$(ls "$GITHUB_WORKSPACE"/awesome-updater-*.pkg.tar.* | head -n1)"
          echo "Package: $pkg"
          pacman -Qlp "$pkg"

          pacman -Qlp "$pkg" | grep -qE ' /usr/bin/system-update$'
          pacman -Qlp "$pkg" | grep -qE ' /usr/bin/system-update-notify$'
          pacman -Qlp "$pkg" | grep -qE ' /etc/profile.d/99-system-update.sh$'
          pacman -Qlp "$pkg" | grep -qE ' /etc/system-update/config.conf$'
          pacman -Qlp "$pkg" | grep -qE ' /usr/lib/systemd/system/awesome-updater@\.service$'
          pacman -Qlp "$pkg" | grep -qE ' /usr/lib/systemd/system/awesome-updater@\.timer$'

          # makepkg compresses man pages to *.1.gz during packaging.
          pacman -Qlp "$pkg" | grep -qE ' /usr/share/man/man1/system-update\.1\.gz$'
          pacman -Qlp "$pkg" | grep -qE ' /usr/share/man/man1/system-update-notify\.1\.gz$'

          bsdtar -xOf "$pkg" .PKGINFO | grep -q '^backup = etc/system-update/config.conf$'
          bsdtar -xOf "$pkg" .PKGINFO | grep -q '^depend = kernel-modules-hook$'

      - name: Confirm @VERSION@ placeholder was substituted
        run: |
          set -e
          pkg="$(ls "$GITHUB_WORKSPACE"/awesome-updater-*.pkg.tar.* | head -n1)"
          bsdtar -xOf "$pkg" usr/bin/system-update > /tmp/su.bin
          if grep -q '@VERSION@' /tmp/su.bin; then
            echo "ERROR: @VERSION@ placeholder was not substituted by prepare()"
            exit 1
          fi