# ============================================================================
# awesome-updater configuration
# ============================================================================
#
# This file is installed and managed by the awesome-updater package.
#
# The defaults below are safe and work out of the box on a fresh Manjaro
# installation. You normally do NOT need to edit this file.
#
# If you want to override individual settings, create the user override
# file:
#
#     ~/.config/system-update/config.conf
#
# and place only the settings you want to change there. User overrides take
# priority over this file, which avoids .pacnew conflicts during package
# upgrades.
#
# Format: KEY=VALUE
#   - Plain text. No shell code is executed.
#   - Unknown keys are ignored.
#
# ============================================================================


# ----------------------------------------------------------------------------
# Official repository updates
# ----------------------------------------------------------------------------
#
# true  = run "pacman -Syu" during each updater execution.
# false = skip official repository updates entirely.
#
OFFICIAL_UPDATES_ENABLED=true


# ----------------------------------------------------------------------------
# AUR support (via yay)
# ----------------------------------------------------------------------------
#
# false = AUR updates are disabled.
#         - yay is NOT installed by this script.
#         - git and makepkg are NOT required for AUR operation.
#         - No AUR operation is performed.
#
# true  = the AUR branch becomes active.
#         - yay is bootstrapped from the AUR if missing.
#         - AUR packages are updated with "yay -Sua".
#
# WARNING:
#   Unattended AUR updates accept AUR PKGBUILD changes without review.
#   Only enable this if you understand and accept that risk.
#
AUR_ENABLED=false


# ----------------------------------------------------------------------------
# Automatic kernel reboot
# ----------------------------------------------------------------------------
#
# true  = after a kernel package update, schedule a one-time system reboot
#         for the configured REBOOT_TIME.
# false = never schedule a reboot automatically. The attention state and
#         login notification will report that a manual reboot is required.
#
AUTOMATIC_REBOOT=true

# Time of the automatic reboot, in local server time. 24-hour format.
#
REBOOT_TIME="02:15:00"


# ----------------------------------------------------------------------------
# Cron integration
# ----------------------------------------------------------------------------
#
# true  = the script installs (or updates) its own crontab entry on the next
#         run. The entry uses CRONTAB_SCHEDULE.
# false = the crontab is never modified automatically.
#
INSTALL_CRONTAB=false

# Standard five-field cron expression.
#
CRONTAB_SCHEDULE="0 */6 * * *"


# ----------------------------------------------------------------------------
# Login notifications
# ----------------------------------------------------------------------------

# TTY / SSH login notification via /etc/profile.d/99-system-update.sh.
# This is the standard Manjaro login hook mechanism.
#
NOTIFY_PROFILE_D=true

# Broadcast a message with "wall" to all connected terminals when the
# attention state changes.
#
NOTIFY_WALL=true

# Per-user desktop notification via XDG autostart and notify-send.
# Has an effect only inside a desktop session where notify-send is
# available. Servers without a desktop session are unaffected.
#
NOTIFY_GUI=true


# ----------------------------------------------------------------------------
# Log retention
# ----------------------------------------------------------------------------
#
# Update logs older than this many days are removed by the updater.
# Must be a positive integer.
#
LOG_RETENTION_DAYS=30